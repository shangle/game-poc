<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Retro Quest - V2</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Game Canvas -->
    <div id="game-canvas-container" class="fullscreen"></div>

    <!-- UI: Crosshair -->
    <div id="crosshair" style="position: fixed; top: 50%; left: 50%; width: 10px; height: 10px; border: 2px solid rgba(255,255,255,0.5); transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none; z-index: 5;"></div>

    <!-- UI: Weapon -->
    <div id="weapon-container" style="position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 300px; height: 300px; z-index: 50; pointer-events: none; transition: transform 0.1s;">
        <div id="weapon-sprite" style="width: 100%; height: 100%; background-repeat: no-repeat; background-position: bottom center; background-size: contain; filter: drop-shadow(0 0 10px black);"></div>
    </div>

    <style>
        #weapon-container.firing {
            transform: translateX(-50%) translateY(20px) scale(1.1);
        }
    </style>

    <!-- UI: Title Screen -->
    <game-title-screen class="fullscreen">
        <div style="color: white; text-align: center; padding-top: 20vh; font-family: sans-serif;">
            <h1>RETRO QUEST</h1>
            <p>Loading Game Engine...</p>
        </div>
    </game-title-screen>

    <!-- UI: HUD -->
    <div id="hud" style="display: none; z-index: 1000;">
        <div class="hud-panel">
            <span class="hud-label">Health</span>
            <span id="hp-value" class="hud-value">100</span>
        </div>
        <div class="hud-panel">
            <span class="hud-label">Score</span>
            <span id="score-value" class="hud-value">0</span>
        </div>
    </div>

    <!-- UI: Touch Controls -->
    <div id="touch-controls" style="display: none; position: fixed; bottom: 2rem; left: 2rem; right: 2rem; justify-content: space-between; align-items: flex-end; z-index: 1001; pointer-events: none;">
        <div id="joystick-base" style="width: 120px; height: 120px; background: rgba(255,255,255,0.1); border-radius: 50%; position: relative; pointer-events: auto; touch-action: none; border: 2px solid rgba(255,255,255,0.2);">
            <div id="joystick-knob" style="width: 50px; height: 50px; background: #0ea5e9; border-radius: 50%; position: absolute; top: 35px; left: 35px; transition: transform 0.05s; box-shadow: 0 0 15px rgba(14, 165, 233, 0.5);"></div>
        </div>
        <button id="touch-fire-btn" style="width: 80px; height: 80px; background: rgba(244, 63, 94, 0.3); border: 4px solid #f43f5e; color: white; border-radius: 50%; font-weight: 900; text-transform: uppercase; font-size: 0.8rem; pointer-events: auto; touch-action: none; display: flex; align-items: center; justify-content: center; backdrop-blur: 5px;">Fire</button>
    </div>

    <!-- UI: Win Overlay -->
    <div id="win-overlay" class="overlay hidden">
        <h2 class="title-text" style="color: #10b981;">VICTORY</h2>
        <p style="font-weight: 900; margin-bottom: 2rem;">FINAL SCORE: <span id="final-score">0</span></p>
        <button class="btn btn-primary" onclick="restartGame()">Play Again</button>
    </div>

    <!-- UI: Game Over Overlay -->
    <div id="over-overlay" class="overlay hidden">
        <h2 class="title-text" style="color: #ef4444;">WASTED</h2>
        <button class="btn btn-primary" onclick="restartGame()">Try Again</button>
    </div>

    <!-- Scripts -->
    <script src="js/cartridge.js"></script>
    <script src="js/title-screen.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
